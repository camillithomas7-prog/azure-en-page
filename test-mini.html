<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test</title></head><body>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#faf7ec;color:#1a1a1a;margin:0;padding:24px}
.wrap{max-width:520px;margin:0 auto}
.offers{border:1.5px solid #1a1a1a;border-radius:14px;overflow:hidden;margin-bottom:14px}
.offer{display:flex;align-items:center;gap:16px;padding:20px 18px;border-bottom:1.5px solid #1a1a1a;cursor:pointer}
.offer:last-child{border-bottom:none}
.radio{width:24px;height:24px;border:2px solid #bbb;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.offer.on .radio{border-color:#1a1a1a}
.offer.on .radio::after{content:"";width:12px;height:12px;background:#1a1a1a;border-radius:50%}
.name{font-size:19px;font-weight:800;flex:1}
.price b{font-size:20px;font-weight:800}
.addon{display:flex;align-items:center;gap:12px;border:1.5px solid #e5e0cf;border-radius:12px;padding:12px;margin-bottom:9px;cursor:pointer;background:#fff}
.addon.on{border-color:#0d3320;background:#f3efdf}
.cb{width:24px;height:24px;border:2px solid #cbcabb;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:900}
.addon.on .cb{background:#0d3320;border-color:#0d3320}
.buy{display:block;width:100%;background:#f3c44d;color:#0b2a1a;border:none;padding:18px;border-radius:10px;font-size:16px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
</style>
<div class="wrap">
<h1>AVERA — test</h1>
<div class="offers" id="offers">
<div class="offer on" onclick="var g=this.parentNode.querySelectorAll('.offer');for(var i=0;i&lt;g.length;i++)g[i].classList.remove('on');this.classList.add('on');"><span class="radio"></span><span class="name">Buy 1 Get 1 Free</span><span class="price"><b>$29.99</b></span></div>
<div class="offer" onclick="var g=this.parentNode.querySelectorAll('.offer');for(var i=0;i&lt;g.length;i++)g[i].classList.remove('on');this.classList.add('on');"><span class="radio"></span><span class="name">Buy 2 Get 2 Free</span><span class="price"><b>$59.99</b></span></div>
<div class="offer" onclick="var g=this.parentNode.querySelectorAll('.offer');for(var i=0;i&lt;g.length;i++)g[i].classList.remove('on');this.classList.add('on');"><span class="radio"></span><span class="name">Buy 3 Get 3 Free</span><span class="price"><b>$89.99</b></span></div>
</div>
<div class="addons" id="addons">
<div class="addon" onclick="this.classList.toggle('on')"><span class="cb">&#10003;</span><span class="name">Scalp Roller + Massager Kit</span><span class="price"><b>$24.00</b></span></div>
<div class="addon" onclick="this.classList.toggle('on')"><span class="cb">&#10003;</span><span class="name">Natural Edge Control Balm</span><span class="price"><b>$18.00</b></span></div>
<div class="addon" onclick="this.classList.toggle('on')"><span class="cb">&#10003;</span><span class="name">Satin Bonnet</span><span class="price"><b>$22.00</b></span></div>
</div>
<button class="buy" id="buyBtn" onclick="var o=document.querySelectorAll('#offers .offer'),B=[7,9,11],D=[13,15,17],p=[],x=0;for(var i=0;i&lt;o.length;i++){if(o[i].classList.contains('on')){x=i;break;}}p.push(B[x]+'.1:1');var a=document.querySelectorAll('#addons .addon');for(var j=0;j&lt;a.length;j++){if(a[j].classList.contains('on'))p.push(D[j]+'.1:1');}location.href=location.pathname.replace(/\/[^\/]*$/,'/checkout')+'?products='+p.join(';');">Add to Cart</button>
</div>
</body></html>
